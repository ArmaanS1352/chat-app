services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chat-frontend
    ports:
      - "5173:5173"
    environment: 
      VITE_API_URL: http://localhost:3001
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chat-backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma